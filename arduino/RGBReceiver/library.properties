sentence=Receive data flashed by the RGB Sender web page, using a colour sensor or RGB photodiodes.
paragraph=Implements RGB Sender protocol v1: self-clocking colour code, per-frame calibration, Reed-Solomon FEC, CRC-16/CRC-32, carousel and XOR parity frames. Drivers for the TCS34725 colour sensor and for three analog photodiodes; other sensors plug in through a small interface. Fits an Arduino Uno.
