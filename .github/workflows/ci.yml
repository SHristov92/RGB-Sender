name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run test:arduino

  arduino:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
            sketches: |
              - arduino/RGBReceiver/examples/ReceiveText
              - arduino/RGBReceiver/examples/SensorTest
              - arduino/RGBReceiver/examples/AnalogPhotodiodes
          - fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            sketches: |
              - arduino/RGBReceiver/examples/ReceiveText
              - arduino/RGBReceiver/examples/SensorTest
              - arduino/RGBReceiver/examples/WiFiSetup
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          sketch-paths: ${{ matrix.sketches }}
          libraries: |
            - source-path: ./arduino/RGBReceiver
